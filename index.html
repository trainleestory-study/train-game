<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <!-- 優化移動端顯示，確保按鈕在手機/平板上清晰易點 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>小小遊樂場 🎮</title>
  <style>
    /* 1. 設置背景色和基本樣式，使用柔和多彩的設計 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      /* 繽紛、柔和的背景漸變色 (天藍色到柔和黃色) */
      background: linear-gradient(135deg, #aedfff 0%, #fff8cd 100%);
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #333;
      overflow: hidden; /* 防止滾動條影響體驗 */
    }

    /* 2. 遊戲容器：更圓潤、更柔和的陰影 */
    #game-container {
      background: white;
      border-radius: 40px; /* 大圓角，看起來更親切 */
      padding: 40px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15); /* 輕柔的陰影 */
      text-align: center;
      max-width: 95%;
      width: 700px;
      position: relative;
    }

    /* 3. 標題：使用大字體和繽紛色彩 */
    h1 {
      font-size: 3rem; /* 巨大字體 */
      margin-bottom: 20px;
      color: #FF6B6B; /* 草莓紅 */
      text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
    }
    h1 span {
      color: #4CAF50; /* 綠色 */
    }
    h1 span.blue {
      color: #2196F3; /* 藍色 */
    }
    p {
      font-size: 1.5rem;
      color: #666;
      margin-bottom: 20px;
    }

    /* 4. 畫布：加上圓角和鮮豔邊框 */
    canvas {
      border: 6px solid #FFC107; /* 鮮豔的黃色邊框 */
      border-radius: 20px;
      background: #fafafa;
      margin-top: 10px;
      max-width: 100%;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
    }

    /* 5. 按鈕：巨大、鮮豔、易點擊 */
    #startBtn {
      background-color: #FF6B6B; /* 草莓紅 */
      color: white;
      padding: 20px 40px;
      border: none;
      border-radius: 50px; /* 大圓角按鈕 */
      font-size: 2rem; /* 巨大字體 */
      font-weight: bold;
      cursor: pointer;
      margin-top: 30px;
      width: 100%; /* 全寬度，更易點擊 */
      box-shadow: 0 6px 0px #e05e5e; /* 按鈕立體感 */
      transition: all 0.1s; /* 按下時的動畫 */
    }
    #startBtn:hover {
      background-color: #ff8080;
    }
    #startBtn:active {
      transform: translateY(4px); /* 按下時稍微下沉 */
      box-shadow: 0 2px 0px #e05e5e;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <h1><span>小</span><span>小</span>遊戲<span class="blue">園</span> 🎮</h1>
    <p>點擊「✨ 開始」按鈕，一起來玩吧！</p>
    
    <!-- 遊戲畫布區域 -->
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    
    <br>
    <!-- 按鈕：更名為繁體中文 -->
    <button id="startBtn" onclick="startGame()">✨ 開始遊戲</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // 初始狀態
    function init() {
        ctx.fillStyle = '#EEE';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#999';
        ctx.font = '30px "Microsoft JhengHei"';
        ctx.textAlign = 'center';
        ctx.fillText('等待遊戲開始...', canvas.width/2, canvas.height/2);
    }
    init();

    // 遊戲開始函數：更新為畫一個可愛的彩虹笑臉
    function startGame() {
      // 1. 清空畫布
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fafafa';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2. 畫彩虹
      const rainbowColors = ['#FF6B6B', '#FF9F43', '#FFC107', '#4CAF50', '#2196F3', '#9C27B0'];
      for (let i = 0; i < rainbowColors.length; i++) {
          ctx.beginPath();
          ctx.lineWidth = 10;
          ctx.strokeStyle = rainbowColors[i];
          ctx.arc(300, 300, 150 + i * 10, Math.PI, 0);
          ctx.stroke();
      }

      // 3. 畫笑臉
      ctx.beginPath();
      ctx.fillStyle = '#FFC107'; // 黃色
      ctx.arc(300, 150, 60, 0, Math.PI * 2);
      ctx.fill();
      ctx.closePath();

      // 眼
      ctx.beginPath();
      ctx.fillStyle = '#333';
      ctx.arc(280, 130, 8, 0, Math.PI * 2); // 左眼
      ctx.arc(320, 130, 8, 0, Math.PI * 2); // 右眼
      ctx.fill();
      ctx.closePath();

      // 嘴
      ctx.beginPath();
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#333';
      ctx.arc(300, 155, 30, 0, Math.PI); // 下弧線
      ctx.stroke();
      ctx.closePath();

      // 4. 添加文字反饋 (繁體中文)
      ctx.fillStyle = '#FF6B6B';
      ctx.font = 'bold 40px "Microsoft JhengHei"';
      ctx.textAlign = 'center';
      ctx.fillText('☀️ 遊戲開始囉！', 300, 260);
    }
  </script>
</body>
</html>
