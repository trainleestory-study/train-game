<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>開心車車大冒險 🚗</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: linear-gradient(135deg, #a8edf8 0%, #fed6e3 100%);
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #333;
      overflow: hidden;
    }

    .container {
      background: white;
      border-radius: 32px;
      padding: 20px 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      text-align: center;
      max-width: 95%;
      width: 480px;
      position: relative;
    }

    .hidden {
      display: none !important;
    }

    h1 {
      font-size: 2rem;
      color: #ff5e7e;
      margin-bottom: 10px;
      text-shadow: 2px 2px 0px #ffe1e8;
    }

    p.subtitle {
      font-size: 1.2rem;
      color: #666;
      margin-bottom: 15px;
    }

    /* 第一頁：選車頁面 */
    .car-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .car-card {
      background: #f8f9fa;
      border: 4px solid #e0e0e0;
      border-radius: 24px;
      padding: 15px 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .car-card .emoji {
      font-size: 3.8rem;
      line-height: 1.1;
    }

    .car-card .name {
      font-size: 1.3rem;
      font-weight: bold;
      margin-top: 8px;
      color: #444;
    }

    .car-card.selected {
      border-color: #ff9f43;
      background: #fff8e7;
      transform: scale(1.05);
      box-shadow: 0 6px 16px rgba(255, 159, 67, 0.3);
