<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>開心車車大冒險 🚗</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #a8edf8 0%, #fed6e3 100%);
      font-family: sans-serif;
    }
    .wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }
    h1 { color: #ff5e7e; margin-bottom: 10px; font-size: 1.8rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
    .btn-car {
      background: #f8f9fa; border: 3px solid #ddd; border-radius: 16px;
      padding: 15px; font-size: 2.5rem; cursor: pointer;
    }
    .btn-car.selected { border-color: #ff9f43; background: #fff8e7; }
    .btn-start {
      background: #2ed573; color: white; border: none; padding: 15px;
      width: 100%; border-radius: 30px; font-size: 1.4rem; font-weight: bold; cursor: pointer;
    }
    .hidden { display: none !important; }
    .ctrl-btn {
      background: #ff9f43; color: white; border: none; border-radius: 50%;
      width: 65px; height: 65px; font-size: 1.8rem; cursor: pointer; margin: 0 10px;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- 選車頁面 -->
    <div id="page-select" class="card">
      <h1>🚗 請選一架車車！</h1>
      <p style="color:#666;">點擊車車，準備出發！</p>
      <div class="grid">
        <button class="btn-car selected" onclick="pick('🚌')">🚌<br><span style="font-size:1rem;">巴士</span></button>
        <button class="btn-car" onclick="pick('🚇')">🚇<br><span style="font-size:1rem;">地鐵</span></button>
        <button class="btn-car" onclick="pick('🚋')">🚋<br><span style="font-size:1rem;">電車</span></button>
        <button class="btn-car" onclick="pick('🚗')">🚗<br><span style="font-size:1rem;">私家車</span></button>
      </div>
      <button class="btn-start" onclick="goGame()">🚦 出發！避開障礙物</button>
    </div>

    <!-- 遊戲頁面 -->
    <div id="page-game" class="card hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <button onclick="goSelect()" style="padding:6px 12px; border-radius:12px; border:none; background:#74b9ff; color:white; font-weight:bold;">↩️ 換車</button>
        <span id="score" style="font-weight:bold; color:#ff6b6b; background:#ffeaa7; padding:5px 10px; border-radius:12px;">進度: 0 / 25</span>
      </div>
      <canvas id="cvs" width="300" height="320" style="background:#555; border-radius:15px;"></canvas>
      <div style="margin-top:15px; display:flex; justify-content:center; align-items:center;">
        <button class="ctrl-btn" onmousedown="move(-30)" ontouchstart="move(-30)">⬅️</button>
        <span style="font-size:3rem;">🎡</span>
        <button class="ctrl-btn" onmousedown="move(30)" ontouchstart="move(30)">➡️</button>
      </div>
    </div>
  </div>

  <script>
    let car = '🚌', x = 130, score = 0, obs = [], timer = null;
    const cvs = document.getElementById('cvs');
    const ctx = cvs.getContext('2d');

    function pick(emoji) {
      car = emoji;
      document.querySelectorAll('.btn-car').forEach(b => b.classList.remove('selected'));
      event.currentTarget.classList.add('selected');
    }

    function goGame() {
      document.getElementById('page-select').classList.add('hidden');
      document.getElementById('page-game').classList.remove('hidden');
      x = 130; score = 0; obs = [];
      document.getElementById('score').innerText = `進度: 0 / 25`;
      if(timer) clearInterval(timer);
      timer = setInterval(loop, 30);
    }

    function goSelect() {
      document.getElementById('page-game').classList.add('hidden');
      document.getElementById('page-select').classList.remove('hidden');
      clearInterval(timer);
    }

    function move(dir) {
      x += dir;
      if(x < 20) x = 20;
      if(x > 240) x = 240;
    }

    function loop() {
      ctx.clearRect(0,0,300,320);
      ctx.fillStyle = '#555'; ctx.fillRect(0,0,300,320);
      ctx.fillStyle = '#7bed9f'; ctx.fillRect(0,0,20,320); ctx.fillRect(280,0,20,320);

      if(Math.random() < 0.04 && obs.length < 3) {
        obs.push({ x: Math.floor(Math.random()*200)+30, y: -30 });
      }

      for(let i=obs.length-1; i>=0; i--) {
        obs[i].y += 3;
        ctx.font = '30px sans-serif';
        ctx.fillText('🏢', obs[i].x, obs[i].y);

        if(obs[i].y > 330) {
          obs.splice(i, 1);
          score++;
          document.getElementById('score').innerText = `進度: ${score} / 25`;
          if(score >= 25) {
            alert('🎉 恭喜通關！成功避開 25 個障礙物！');
            goSelect();
          }
        }
      }

      ctx.font = '40px sans-serif';
      ctx.fillText(car, x, 280);
    }
  </script>
</body>
</html>
